name: sandbox
description: "A clean Flutter starter app with a login and menu."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartz: ^0.10.1
  equatable: ^2.0.5
  flutter_bloc: ^8.1.3
  get_it: ^8.0.3
  go_router: ^14.6.2
  injectable: ^2.3.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.4

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
        - asset: assets/fonts/PlusJakartaSans-Italic[wght].ttf
          style: italic
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Italic[wght].ttf
          style: italic

  assets:
    - assets/
    - assets/images/
    - lib/core/localization/translations/
    - lib/features/auth/presentation/i18n/
    - lib/features/menu/presentation/i18n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0D47A1"

flutter_native_splash:
  color: "#F3EFE4"
  android: true
  ios: true
  android_12:
    color: "#F3EFE4"
    # A same-colour pixel keeps Android's mandatory launch icon visually blank.
    image: android/app/src/main/res/drawable/background.png
